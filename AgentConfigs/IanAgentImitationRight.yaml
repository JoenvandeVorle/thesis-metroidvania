behaviors:
  IanImitationRight:
    trainer_type: ppo
    hyperparameters:
      batch_size: 32
      buffer_size: 256
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        strength: 1.0
        gamma: 0.99
      curiosity:
        strength: 0.01
        gamma: 0.99
        learning_rate: 3.0e-4
      gail:
        strength: 0.2
        gamma: 0.99
        network_settings:
          normalize: true
          hidden_units: 128
          num_layers: 2
        demo_path: Assets\Tests\RLAgents\IanAgent24\Imitation\DemosRight
        use_vail: true
        use_actions: true
    behavioral_cloning:
      demo_path: Assets\Tests\RLAgents\IanAgent24\Imitation\DemosRight
      strength: 0.2
      steps: 80000
    keep_checkpoints: 5
    max_steps: 500000
    time_horizon: 32
    summary_freq: 2000
