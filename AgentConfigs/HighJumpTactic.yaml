behaviors:
  HighJumpTactic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 32
      buffer_size: 256
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      # curiosity:
      #   strength: 0.05
      #   gamma: 0.95
      gail:
        strength: 0.075
        gamma: 0.90
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
        demo_path: Assets/Tests/RLAgents/AgentAsTactic/Training/HighJump/HighJumpDemos
        use_vail: true
        use_actions: false
    behavioral_cloning:
      demo_path: Assets/Tests/RLAgents/AgentAsTactic/Training/HighJump/HighJumpDemos
      strength: 0.4
      steps: 10000
    keep_checkpoints: 5
    max_steps: 250000
    time_horizon: 32
    summary_freq: 2000
