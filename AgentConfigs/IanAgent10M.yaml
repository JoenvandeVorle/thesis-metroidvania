behaviors:
  Ian10M:
    trainer_type: ppo
    hyperparameters:
      batch_size: 32
      buffer_size: 256
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.1
        gamma: 0.99
        encoding_size: 256
        learning_rate: 3.0e-4
    behavioral_cloning:
      demo_path: Assets\Tests\RLAgents\IanAgent24\10M\Demos
      strength: 0.1
      steps: 5000
    keep_checkpoints: 5
    max_steps: 10000000
    time_horizon: 32
    summary_freq: 2000
